<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palabras en nuevos contextos</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#243747;background:#e9f1f3}*{box-sizing:border-box}body{margin:0}.stage{max-width:1280px;min-height:720px;margin:auto;padding:22px 28px;background:#f5f9fa}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h1{font-size:31px;margin:0;color:#183946}header span{font-size:17px;color:#526976}.panel{background:white;border:2px solid #d7e5e9;border-radius:18px;padding:17px 20px;margin-bottom:16px}.instruction{font-size:18px;margin:0 0 12px}.bank{display:flex;gap:9px;flex-wrap:wrap}.chip{border:1px solid #a7cbd0;background:#e7f5f2;padding:7px 12px;border-radius:999px;font-size:17px;font-weight:600;color:#146d6c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:white;border:2px solid #d7e5e9;border-radius:13px;padding:12px 14px;min-height:89px}.sentence{font-size:18px;line-height:1.35;margin:0 0 8px}.number{color:#0b7774;font-weight:700}.answer{display:flex;align-items:center;gap:8px}input{width:100%;min-width:0;padding:8px 10px;border:2px solid #b8ccd2;border-radius:9px;font-size:18px}input:focus{outline:3px solid #addcd7;border-color:#157b79}.mark{min-width:22px;font-size:20px;font-weight:bold}.correct{color:#188151}.wrong{color:#b94a35}.footer{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:16px}.feedback{margin-right:auto;font-size:18px;font-weight:bold}button{background:#087e7c;border:0;border-radius:11px;color:white;padding:12px 20px;font-size:18px;cursor:pointer}button.secondary{background:#e6eef0;color:#284753}@media(max-width:800px){.stage{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:25px}header span{display:none}.sentence{font-size:17px}}
</style></head><body><main class="stage"><header><h1>Palabras en nuevas situaciones</h1><span>Completa las frases</span></header><section class="panel"><p class="instruction">Usa cada palabra una vez. Escribe la palabra correcta en cada espacio.</p><div class="bank" id="bank"></div></section><section class="grid" id="exercises"></section><div class="footer"><span class="feedback" id="feedback" aria-live="polite"></span><button class="secondary" id="reset">Reiniciar</button><button id="check">Comprobar</button></div></main><script>
const words=['una época','la violencia','morir','los narcotraficantes','un atentado','una bomba','un grupo guerrillero','asesinar','abandonar','sufrir'];
const questions=[
['Mis abuelos vivieron en ______ sin internet.','una época'],
['En la película, el héroe quería terminar con ______.','la violencia'],
['La planta no tenía agua y empezó a ______.','morir'],
['La policía buscaba a ______ porque vendían drogas.','los narcotraficantes'],
['En la historia, hubo ______ contra el presidente.','un atentado'],
['En el videojuego, encontraron ______ dentro de una caja.','una bomba'],
['En la novela, ______ vivía en las montañas y luchaba contra el gobierno.','un grupo guerrillero'],
['En la película, el personaje quería ______ al rey.','asesinar'],
['Por el incendio, todos tuvieron que ______ la escuela.','abandonar'],
['Cuando perdió a su perro, Ana empezó a ______ mucho.','sufrir']];
const bank=document.getElementById('bank'),exercise=document.getElementById('exercises'),feedback=document.getElementById('feedback');
words.forEach(w=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=w;bank.appendChild(chip)});
questions.forEach(([q],i)=>{const wrap=document.createElement('article');wrap.className='item';const p=document.createElement('p');p.className='sentence';const n=document.createElement('span');n.className='number';n.textContent=(i+1)+'. ';p.append(n,document.createTextNode(q));const row=document.createElement('div');row.className='answer';const inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('aria-label','Respuesta '+(i+1));const mark=document.createElement('span');mark.className='mark';row.append(inp,mark);wrap.append(p,row);exercise.append(wrap);inp.addEventListener('input',()=>{mark.textContent='';mark.className='mark';feedback.textContent=''})});
const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
document.getElementById('check').onclick=()=>{let count=0;document.querySelectorAll('input').forEach((input,i)=>{const mark=input.nextElementSibling;let ok=normalize(input.value)===normalize(questions[i][1]);count+=ok?1:0;mark.textContent=ok?'✓':'✗';mark.className='mark '+(ok?'correct':'wrong')});feedback.textContent=count+' de '+questions.length+' correctas'+(count===questions.length?' · ¡Muy bien!':'')};
document.getElementById('reset').onclick=()=>{document.querySelectorAll('input').forEach(input=>{input.value='';input.nextElementSibling.textContent=''});feedback.textContent=''};
</script></body></html>
